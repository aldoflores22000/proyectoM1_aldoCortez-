<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colorfly Studio</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header>
    <nav class="nav-bar">
      <a class="logo" href="#index.html">
        <img src="./images/logo-color-fly-web.png" alt="Logo de Colorfly">        
      </a>
    </nav>
    <h1>Genera Paletas de Colores en instantes</h1>
  </header>

  <main>
    <!-- Panel de control -->
    <section class="control-panel">
      <div class="selector-block">
        <label for="palette-size">Cantidad de colores:</label>
        <select id="palette-size">
          <option value="6">6 colores</option>
          <option value="8">8 colores</option>
          <option value="9">9 colores</option>
        </select>
      </div>

      <div class="selector-block">
        <span>Formato:</span>
        <div class="format-options">
          <label><input type="radio" name="format" value="hsl" checked> HSL</label>
          <label><input type="radio" name="format" value="hex"> HEX</label>
        </div>
      </div>

      <div class="selector-block">
        <button id="generate-btn">Generar paleta</button>
        <button id="save-btn">Guardar paleta</button>
      </div>
    </section>

    <!-- Paleta generada -->
    <section id="palette-container"></section>

    <!-- Feedback -->
    <section id="feedback"></section>

    <!-- Paletas guardadas -->
    <section id="saved-palettes">
      <h2>Paletas guardadas</h2>
      <div id="saved-list"></div>
    </section>
  </main>

  <footer>
    <p>ColorFly una Marca de AldoC</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
