<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colorfly Studio</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header>
    <h1>Generador de Paletas de Colores</h1>
  </header>

  <main>
    <section>
      <label for="palette-size">Tamaño de la paleta:</label>
      <select id="palette-size">
        <option value="6">6 colores</option>
        <option value="8">8 colores</option>
        <option value="9">9 colores</option>
      </select>
    </section>

    <section>
      <button id="generate-btn">Generar paleta</button>
    </section>

    <section id="palette-container">
      <!-- Aquí se mostrarán los colores generados -->
    </section>

    <section id="feedback">
      <!-- Aquí aparecerá el microfeedback (tooltip, mensaje, etc.) -->
    </section>
  </main>

  <footer>
    <p>ColorFly una Marca de AldoC</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
