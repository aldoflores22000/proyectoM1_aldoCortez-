<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colorfly Studio</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <nav>
      <a href="index.html" class="logo">
        <img src="/images/color-fly-mariposa.png" alt="logo-color-fly-web">
        <span>ColorFly</span>
      </a>
      <ul>
        <li>Acerca de</li>
      </ul>
    </nav>
    <h1>Genera tus paletas</h1>
  </header>

  <main>
    <!-- Barra de control dividida -->
    <section class="control-panel">
      <!-- Área izquierda -->
      <div class="left-controls">
        <div class="selector-block">
          <label>Cantidad de Paletas</label>
          <div class="palette-size-options">
            <button class="size-btn active" data-size="6">6</button>
            <button class="size-btn" data-size="8">8</button>
            <button class="size-btn" data-size="9">9</button>
          </div>
        </div>
        <button id="generate-btn">Generar paleta</button>
      </div>

      <!-- Área derecha -->
      <div class="right-controls">
        <div class="selector-block">
          <label>Formato</label>
          <div class="format-options">
            <button class="format-btn active" data-format="hsl">HSL</button>
            <button class="format-btn" data-format="hex">HEX</button>
          </div>
        </div>
        <button id="save-btn">Guardar Paleta</button>
      </div>
    </section>

    <!-- Paleta generada -->
    <section id="palette-container"></section>

    <!-- Feedback -->
    <section id="feedback"></section>

    <!-- Paletas guardadas -->
    <section id="saved-palettes">
      <h2>Paletas guardadas</h2>
      <div id="saved-list"></div>
    </section>
  </main>

  <footer class="footer">
    <p>ColorFly una Marca de AldoC</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
